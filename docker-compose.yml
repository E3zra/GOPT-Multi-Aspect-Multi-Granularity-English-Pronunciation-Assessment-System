version: '3.8'

services:
  gopt:
    build:
      context: .
      dockerfile: Dockerfile
    image: gopt:latest
    container_name: gopt-pipeline
    
    # Environment variables
    environment:
      - KALDI_ROOT=/opt/kaldi
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0  # Set to empty string to disable GPU
    
    # Volume mappings
    volumes:
      # Audio input directory - place your .wav files here
      - ./audio_input:/workspace/audio_input
      
      # Audio output directory - results will be saved here
      - ./audio_output:/workspace/audio_output
      
      # Librispeech models - download and place models here
      - ./models:/workspace/models
      
      # Experiment results and logs
      - ./exp:/workspace/gopt/exp
      
      # Optional: Mount data directory if you want to preserve processed data
      - ./data:/workspace/gopt/data
      
      # Optional: Mount pretrained models if not already in image
      - ./pretrained_models:/workspace/gopt/pretrained_models
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    
    # GPU support (uncomment if you have NVIDIA GPU)
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    
    # Working directory
    working_dir: /workspace/gopt
    
    # Default command
    command: /bin/bash
    
    # Network
    networks:
      - gopt-network

networks:
  gopt-network:
    driver: bridge

